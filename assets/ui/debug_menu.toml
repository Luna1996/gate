[[items.children]]
kind = "sub_menu"
id = "refl"
label = "menu.render.refl"

# 镜面档位：只改**反射内容的着色口径**，不改逐面量化的粒度（镜面恒为一个体素面一个反射值）。
# 档 0/1/2 都不发额外射线，只有最后一档在反射命中点补太阳 NEE（每个触发像素 +1 次 DDA）。
# 默认 `selected = 2` 与 Rust 侧 `ReflectionSettings::default()` 一致。
[[items.children.children]]
kind = "switch_group"
id = "tier"
label = "menu.render.refl.tier"
options = [
    "menu.render.refl.tier.off",
    "menu.render.refl.tier.sun",
    "menu.render.refl.tier.sky",
    "menu.render.refl.tier.shadow",
]
selected = 2
tooltip = "menu.render.refl.tier.tip"

# 镜面嵌套层级：镜子里的镜子最多再反射几级（`0 / 1 / 2 / 4`）。
# **只在"上一级命中的面本身也是镜面"时才继续发线** ⇒ 墙 / 地形在第一级就断链，
# 日常场景下这几个档的画面与成本完全一样。最坏 `层级 + 1` 条反射射线。
# 默认 `selected = 0` 与 Rust 侧 `ReflectionSettings::default()` 一致（= 不嵌套）。
[[items.children.children]]
kind = "switch_group"
id = "nest"
label = "menu.render.refl.nest"
options = [
    "menu.render.refl.nest.0",
    "menu.render.refl.nest.1",
    "menu.render.refl.nest.2",
    "menu.render.refl.nest.4",
]
selected = 0
tooltip = "menu.render.refl.nest.tip"

