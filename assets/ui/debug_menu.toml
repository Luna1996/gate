# 偏移距离：笔触几何中心相对**点击选中的体素**沿命中面法线方向的偏移（体素）。
# 放置取 `+offset`、摧毁取 `-offset`（反方向）；中心必须是整数体素格 ⇒ 落笔时四舍五入到格。
# 改「笔触大小」时自动置为 `大小 / 2`（仍可自由输入）——初值 `1.5` = 大小 `3` 的一半。
[[items.children.children.children]]
kind = "input"
id = "offset"
label = "menu.game.edit.offset"

[[items.children.children.children.fields]]
label = ""
text = "1.5"
min = 0.0
max = inf
step = 0.5
decimals = 1

