# ---- 天空：时间（天象）+ 径向模糊（光柱）+ 天体盘 + 颜色 ----
# 推导与取舍见 `gate-render/src/sky.rs`（时间控件的缺省必须与 `SkySettings::default()` 一致）；
# 光柱的算法、成本模型与取舍见 `gate-render/src/volumetric.rs` 与
# `assets/shaders/voxel_raytrace/volumetric.wesl`（本段只给「档位 → 数值」的映射）。
# 「径向模糊」「天体盘」「颜色」三组各有一个「覆写」开关：关（默认）⇒ 该组随时刻变化、
# 下面的滑杆实时显示当前值；开 ⇒ 用下面的值（拖动任一项会自动打开覆写）。
[[items.children]]
