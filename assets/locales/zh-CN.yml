# gate-app 中文文案表（rust-i18n 编译期 codegen 进二进制）
#
# 格式：_version 1 = 每语言一个文件（assets/locales/<locale>.yml），加语言 = 加文件 +
# 调 rust_i18n::set_locale。
#
# 约定：
# - 键 = 「模块.控件」语义路径，调用点写 t!("模块.控件")
# - 占位符 %{name}；**定长对齐的数字由调用点先 format! 好再传入**（%{x} 是原样替换，
#   不会丢 "{:>7.1}" 这类宽度），所以数字列宽不随语言变化
# - 只收**可见 UI 文案**。以下保持英文、不进本表：
#   日志、技术标识符（DDGI / LOD / DDA）、单位（v/s、vx）、材质预设名（EDIT_MATERIALS.name）
# - **DebugMenu 的文案 key 在本表 menu.\* 段**：菜单树存 key（assets/ui/debug_menu.toml），
#   渲染时解析；切语言后整棵树重解析（gate-app 的 sync_ui_locale → gate-ui UiTranslator）
_version: 1

