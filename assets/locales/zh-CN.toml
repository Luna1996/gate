"menu.render.gi.res.half" = "1/2"
"menu.render.gi.res.quarter" = "1/4"
"menu.render.gi.res.eighth" = "1/8"
"menu.render.gi.res.tip" = """
GI 采样网格边长 = 渲染分辨率 ÷ 档位：**只决定每帧往世界缓存里灌多少样本**，不再是最终画面分辨率。

画面上的间接光来自世界空间辐照度缓存，按体素中心取值，所以 `1/4` 只是收敛更慢，不会更糊。
代价按 GI 像素数计：`1/4` ≈ 全分辨率的 `1/16`。"""
"menu.render.gi.cell" = "缓存单元"
"menu.render.gi.cell.1" = "1px"
"menu.render.gi.cell.2" = "2px"
"menu.render.gi.cell.4" = "4px"
"menu.render.gi.cell.8" = "8px"
"menu.render.gi.cell.tip" = """
世界空间辐照度缓存的一个单元在屏幕上占多少像素：**近处单元更细、远处按距离自动放大**。

- `1px`：每个可见体素一个单元，最锐利，缓存和探测开销最大
- `2px`（默认）：细节到体素级，开销约为前者一半
- `4px` / `8px`：更省，等价于更粗的间接光分辨率

每一级单元同时写进粗 `2/4/8` 倍的三级父单元，未成熟时先取父级值 ⇒ 新出现的表面立刻有平滑结果。"""
"menu.render.gi.gain" = "自发光增益"
"menu.render.gi.gain.0" = "0"
"menu.render.gi.gain.2" = "×2"
"menu.render.gi.gain.4" = "×4"
"menu.render.gi.gain.8" = "×8"
"menu.render.gi.gain.16" = "×16"
"menu.render.gi.gain.tip" = """
自发光体素的辐亮度 = `albedo × emissive × 增益`。

- 体素 2 cm、一盏 `6 cm` 的灯在 1 m 外要照亮房间，辐亮度需要与阳光下的白墙同量级
  ⇒ 满亮度自发光在 `×8` 左右才像一盏灯；`×2` 以下只适合大面积发光面（岩浆湖、发光天花板）
- **自发光是真实光源**：能被 NEE 直接采样、投影、参与多跳，不需要在菜单里登记光源列表"""
"menu.render.gi.nee" = "光源采样"
"menu.render.gi.nee.tip" = """
对**可见自发光瓦片**做直接光采样（NEE）：沿光树按距离/功率选一个发光面，从当前表面发一条阴影射线。

- **开**（默认）：小光源不再靠天光射线"碰巧命中"，细小的灯也能映出稳定光斑与阴影；光源数量没有上限（世界空间瓦片表 + 按功率的层级树）
- **关**：只靠余弦半球采样，小灯的方差极大（画面会闪）

与 BRDF 命中按平衡启发式合并，同一块发光面不会被算两次。"""
"menu.render.gi.wal" = "次级强制刷新"
"menu.render.gi.wal.tip" = """
次级（屏幕外）表面的采样策略。

- **关**（默认，自适应）：命中点的缓存未成熟或本帧没被采样过时才补一条射线
- **开**：每个未成熟的命中点每帧都补一条 ⇒ 屏幕外的多跳收敛更快，代价是 GI 射线更多

屏幕内的表面始终由 GI 采样网格驱动，不受这一项影响。"""
