（本引擎没有 shadow map，阴影就是一条 DDA 射线）⇒ 光柱形状由真实几何决定。

**想要光柱明显、又不要把世界雾掉**：调「光柱增益」，别调「消光 σt」。
关掉 ⇒ 整条链一条 dispatch 都不发（**太阳盘与日晕照常绘制**，它们走的是天空背景那条路径）。"""
"menu.render.sun.vol_res" = "分辨率"
"menu.render.sun.vol_res.full" = "1/1"
"menu.render.sun.vol_res.half" = "1/2"
"menu.render.sun.vol_res.quarter" = "1/4"
"menu.render.sun.vol_res.tip" = """
雾网格边长 = 渲染分辨率 ÷ 档位。代价按**雾像素数**计（每像素 1 条主射线 + `S` 条阴影射线）：
