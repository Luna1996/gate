"menu.game.edit.shape.sphere" = "球体"
"menu.game.edit.shape.cube" = "正方体"
"menu.game.edit.size" = "笔触大小"
"menu.game.edit.color" = "颜色"
"menu.game.edit.emissive" = "自发光"
"menu.game.edit.emissive.tip" = """
发光强度（`0..255`，发光色 = 颜色 × 强度）。

**PBR 变体**下变为槽级覆盖：最低档 `0` = 不覆盖（用资产值）。"""
"menu.game.edit.alpha" = "透明度"
"menu.game.edit.alpha.tip" = """
**混合比**：`100` = 全透（透射率 `1`），`0` = 不透明。

- **平凡变体**：写材质的透射率字节（`> 0` 自动标为可穿透介质）
- **PBR 变体**：槽级透射覆盖，最低档 `0%` = 不覆盖

介质吸收按**介质段一次**（与厚度无关）⇒ 厚块不会越厚越黑。"""
"menu.game.edit.smooth" = "光滑度"
"menu.game.edit.smooth.tip" = """
`100` = 完全镜面（粗糙度 `0`），`0` = 完全粗糙。

- **平凡变体**：写材质的粗糙度字节
- **PBR 变体**：槽级粗糙度覆盖，最低档 `0` = 不覆盖"""
"menu.game.edit.pbr" = "PBR 变体"
"menu.game.edit.pbr.tip" = """
笔触落盘时产出哪种材质条目。

- **关**（默认）：平凡材质 —— 颜色 / 自发光 / 透明度 / 光滑度直接写进条目
- **开**：PBR 材质 —— 改为「资产槽号 + 槽级覆盖」，上面四个控件随之变成覆盖（最低档 = 不覆盖）"""
"menu.game.edit.pbr_asset" = "PBR 资产"
"menu.game.edit.metal" = "金属度"
"menu.game.edit.metal.tip" = """
`metallic` 的槽级覆盖（仅 PBR 变体）：`0` = 不覆盖、`100` = 完全金属。"""
"menu.game.edit.ior" = "折射率"
"menu.game.edit.ior.tip" = """
`100..300` = IOR `1.00..3.00`（默认 `150` = 玻璃）。

⚠️ IOR 是**资产级**参数（palette 槽里没有它的位置）⇒ 本滑杆只记录菜单值、**不改画面**；想立刻见效请用「高光度」。"""
"menu.game.edit.spec" = "高光度"
"menu.game.edit.spec.tip" = """
`specular` 的槽级覆盖（仅 PBR 变体）：`0` = 不覆盖、`100` = `1.0`。

乘性调制电介质 F0，**对金属无效**。"""
