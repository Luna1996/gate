只在「直光阴影」开启时生效。软影每格固定 16 个盘面方向、每帧取 4 个并复用世界空间缓存，静止画面稳定不抖动。
"""
"menu.render.base.soft_angle" = "软影角度"
"menu.render.base.soft_angle.tip" = """
软阴影使用的太阳角径，**独立于天空可见盘**。越大越软、远处越糊；越小越锐利。`0` = 硬边，`1.0°` 左右接近真实太阳尺度，`2.4°` 接近默认天空盘。
"""
"menu.render.gi" = "光照"
"menu.render.gi.enabled" = "开启"
"menu.render.gi.res" = "GI分辨率"
