"menu.game.edit.emissive" = "自发光"
"menu.game.edit.emissive.tip" = """
发光强度（`0..255`，发光颜色 = 颜色 × 强度）。

- **平凡变体**：直接就是该材质的发光字节，`0` = 不发光
- **PBR 变体**（见「PBR 变体」开关）：变成**槽级覆盖** —— **最低档 `0` = 不覆盖**（用资产的值），往右依次覆盖为 `0.004 → 1.0`"""
"menu.game.edit.alpha" = "透明度"
"menu.game.edit.alpha.tip" = """
`100` = 完全不透明（透射率 `0`），`0` = 全透（透射率 `1`）。

- **平凡变体**：直接写材质的透射率字节（`> 0` 会被自动标成可穿透介质）
- **PBR 变体**：变成**槽级透射覆盖** —— **最低档 `0` = 不覆盖**（用资产的值）；覆盖值 `> 0` 时该体素成为介质"""
"menu.game.edit.smooth" = "光滑度"
"menu.game.edit.smooth.tip" = """
`100` = 完全镜面（粗糙度 `0`），`0` = 完全粗糙（粗糙度 `1`）。

- **平凡变体**：直接写材质的粗糙度字节
- **PBR 变体**：变成**槽级粗糙度覆盖** —— **最低档 `0` = 不覆盖**（用资产的贴图值）；`100%` 给出粗糙度**精确 0**（镜面）"""
"menu.game.edit.pbr" = "PBR 变体"
"menu.game.edit.pbr.tip" = """
笔触落盘时产出哪种材质条目（`docs/PLAN.md` D1 的 8B 变体复用）。

- **关（默认）**：平凡材质 —— 颜色 / 自发光 / 透明度 / 光滑度 四个控件直接写进条目，与改动前完全一致
- **开**：PBR 材质 —— 条目改为「资产槽号 + 5 个标量覆盖」，那四个控件随之变成**槽级覆盖**（最低档 = 不覆盖）；
  颜色不参与（albedo 来自资产贴图，不做逐实例染色）

两种变体共用同一个 BRDF（`IS_PBR` 只决定参数从哪来），切过去只影响之后新落的体素。"""
"menu.game.edit.pbr_asset" = "PBR 资产"
"menu.game.edit.metal" = "金属度"
"menu.game.edit.metal.tip" = """
`metallic` 的**槽级覆盖**（只在 PBR 变体下生效）：`0` = 不覆盖（用资产的库/贴图值），`100` = 完全金属。

金属的 F0 = albedo（基色即镜面色），非金属的 F0 由资产 IOR 导出 —— 只调制非金属的是「高光度」。"""
"menu.game.edit.ior" = "折射率"
"menu.game.edit.ior.tip" = """
`100..300` = IOR `1.00..3.00`（默认 `150` = 1.50，即玻璃/常见电介质）。

⚠️ **IOR 是资产级参数**（同时服务玻璃折射与电介质 F0 = `((n−1)/(n+1))²`，`docs/PLAN.md` D1「F0 的唯一来源规则」）：
这 8B 的 palette 槽里**没有** IOR 的位置 ⇒ 本滑杆目前只记录/回显菜单值（日志的 `材质 → …` 一行），
**不会**改动画面。想立刻看到 F0 的变化请用「高光度」（槽级覆盖）。"""
"menu.game.edit.spec" = "高光度"
"menu.game.edit.spec.tip" = """
`specular` 的**槽级覆盖**（只在 PBR 变体下生效，语义同 glTF `KHR_materials_specular`）：
`0` = 不覆盖（用资产的值），`100` = `1.0`（不调制）。

它**乘性调制电介质 F0**（`F0 = ((IOR−1)/(IOR+1))² × specular`），**对金属无效** —— 全工程只有这一个 F0 来源。"""
