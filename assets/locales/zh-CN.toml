"menu.game.edit.offset" = "偏移距离"
"menu.game.edit.offset.tip" = """
笔触几何中心相对**点击选中的体素**沿命中面法线方向的偏移（体素）：
**放置**取 `+偏移`（往**外**推）、**摧毁**取 `−偏移`（往**内**挖）。

取 `1` 就是旧的"放置贴面外一格"，取 `0` 则是"以命中格为中心"（放置不再外推）。

改「笔触大小」时本值**自动**置为大小的一半（`3` ⇒ `1.5`），之后仍可自由输入。
笔触中心必须落在**整数体素格**上 ⇒ 落笔时四舍五入（`1.5 ⇒ 2`）。"""
"menu.game.edit.color" = "颜色"
"menu.game.edit.emissive" = "自发光"
"menu.game.edit.emissive.tip" = """
发光强度（`0..255`，发光色 = 颜色 × 强度）。**仅平凡变体**。"""
"menu.game.edit.alpha" = "透明度"
"menu.game.edit.alpha.tip" = """
**混合比**：`100` = 全透（透射率 `1`），`0` = 不透明。**仅平凡变体**。

`> 0` 会自动标为可穿透介质。介质吸收按**介质段一次**（与厚度无关）⇒ 厚块不会越厚越黑。"""
"menu.game.edit.smooth" = "光滑度"
"menu.game.edit.smooth.tip" = """
`100` = 完全镜面（粗糙度 `0`），`0` = 完全粗糙。**仅平凡变体** —— PBR 的粗糙度来自 roughmetal 贴图。"""
"menu.game.edit.pbr" = "PBR 变体"
"menu.game.edit.pbr.tip" = """
笔触落盘时产出哪种材质条目。

- **关**（默认）：平凡材质 —— 颜色 / 自发光 / 透明度 / 光滑度 / 金属度直接写进条目
- **开**：PBR 材质 —— 只记「资产槽号」，**参数全部由资产与它的贴图决定**（albedo + roughmetal 贴图、资产的 emissive / IOR）⇒ 本页其余材质控件**整行置灰、不生效**（含颜色，PBR 不做 tint）

置灰不改值：切回平凡变体时之前调好的参数原样还在。"""
"menu.game.edit.pbr_asset" = "PBR 资产"
"menu.game.edit.metal" = "金属度"
"menu.game.edit.metal.tip" = """
**关** = 电介质、**开** = 完全金属。**仅平凡变体**。

金属度物理上是**二值**的：连续量只是为了给贴图表达过渡（锈蚀 / 磨损 / 掉漆），平凡变体没有贴图可承载它。

**这就是"做镜面"的旋钮** —— 打开时同时给两样东西：

- `F0` = 颜色本身（电介质的 `F0` 只有 `0.04`，正视下反射项仅 `4%`，看不出镜面）
- `kD = 0`：漫反射清零（少了它，那 `96%` 的漫反射会把镜面盖住）

**镜面配方**：颜色 `白色` + 光滑度 `100`（粗糙度 `0`，≥ `96` 才触发反射射线）+ 金属度**开**。
⚠️ 一个方块只有 1 个体素面 ⇒ 只有 1 个反射值，要看到成像得涂**一整片**镜面。"""
