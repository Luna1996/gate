"menu.render.gi.denoise.tip" = """
- **关**：不跑降噪链，直接看原始 GI + 几何感知上采样
- **低**（默认）：时域累积 + 5 轮 `3×3` atrous
- **中**：atrous 换 `5×5`
- **高**：候选数翻倍（GI 射线翻倍）+ 记忆窗 `20→32` 帧"""
"menu.render.gi.interval" = "分帧"
"menu.render.gi.interval.1" = "1"
"menu.render.gi.interval.2" = "2"
"menu.render.gi.interval.4" = "4"
"menu.render.gi.interval.8" = "8"
"menu.render.gi.interval.tip" = """
把 GI 采样预算**摊到 N 帧**：每帧只发 `基准候选 ÷ N` 条射线，记忆窗同步 ×N。

**帧时间恒定、稳态噪声不变**（窗内样本数 = 候选数 × 记忆窗，相乘抵消），代价是响应时间 ×N。
`8` 需要「降噪质量 = 高」（每帧 1 条）；低/中档下每帧至少 1 条 ⇒ `8` 等同 `4`。"""
"menu.render.gi.realloc" = "方差驱动"
"menu.render.gi.realloc.off" = "关"
"menu.render.gi.realloc.mild" = "弱"
"menu.render.gi.realloc.mid" = "中"
"menu.render.gi.realloc.strong" = "强"
"menu.render.gi.realloc.tip" = """
按**"已经有多干净"**重分配每帧射线预算（代理量 = 上一帧 reservoir 的样本数 `M`）：
收敛的像素少发（×`0.70 / 0.50 / 0.25`），刚变脏的多发（×`1.40 / 2.00 / 4.00`）。

记忆窗同步放大 ⇒ **窗内样本数不变**：噪声不变、只有响应时间随像素变，因此不会振荡。
默认**关**（阈值与钳位尚未校准）。"""
"menu.render.gi.sun_bounce" = "太阳反弹"
"menu.render.gi.sun_bounce.tip" = """
GI 二次顶点是否朝太阳发一条阴影射线（NEE）。

- **开**：阴影区被阳光「弹亮」
- **关**（默认）：只剩天光项，**整条阴影射线都不发**（2K + `1/4` 档下省 `gate_gi` 的 ~`40%`）

这是**能量取舍**（不是噪声取舍），降噪救不回来。"""
"menu.render.refl" = "反射"
"menu.render.refl.tier" = "镜面质量"
"menu.render.refl.tier.tip" = """
不透明镜面反射追到什么程度。**镜面恒为逐体素面**（一个面一个反射值）—— 档位只改反射内容的着色口径。

- **关**：不发反射射线，只有 `F0·(amb+gi)` 环境近似
- **直射**：反射命中点带上太阳直射与自发光（**0 条额外射线**）。这是"像镜子"的最低要求：命中几何只取天光项时比反射到的天空暗约 `20` 倍，除了天空亮斑什么都看不见
- **天空**（默认）：再让逃逸天空走 `sky_primary`（**0 条额外射线**）⇒ 镜像里看得见太阳盘 / 光晕
- **阴影**：再给反射命中点补太阳 NEE（**每个触发像素 +1 次 DDA**）⇒ 镜像里的明暗正确；上面两档是**无遮挡近似**（背光的墙在镜子里也亮）

⚠️ **要镜面就得涂一整片**：单个方块只有 1 个面 ⇒ 只有 1 个颜色，看不出成像。"""
"menu.render.refl.tier.off" = "关"
"menu.render.refl.tier.sun" = "直射"
"menu.render.refl.tier.sky" = "天空"
"menu.render.refl.tier.shadow" = "阴影"
"menu.render.refl.nest" = "嵌套层级"
"menu.render.refl.nest.tip" = """
镜子里的镜子最多再反射几级。`0` = 不嵌套（镜子里看不到另一面镜子的倒影），`1 / 2 / 4` = 依次多嵌几级。

**成本只在真的"镜子对着镜子"时才付**：链条遇到**非镜面**的面（墙 / 地形 / 普通方块）立刻断开 ⇒ 日常场景下 `0 / 1 / 2 / 4` 的画面与成本**完全一样**，多出来的只是一次判据。

最坏情况：每个触发像素 `层级 + 1` 条反射射线（上面「镜面档位」选「阴影」时每条再 +1 条阴影射线）。

嵌套的镜像仍是**块状镜面**（每级方向都按体素面量化），与逐面平色的画风一致。"""
"menu.render.refl.nest.0" = "0"
"menu.render.refl.nest.1" = "1"
