"menu.game.edit.place.hover" = "光标命中"
"menu.game.edit.place.clear" = "全部销毁"
"menu.game.edit.color" = "颜色"
"menu.game.edit.emissive" = "自发光"
"menu.game.edit.emissive.tip" = """
发光强度（`0..255`，发光色 = 颜色 × 强度）。**仅平凡变体**。"""
"menu.game.edit.alpha" = "透明度"
"menu.game.edit.alpha.tip" = """
**混合比**：`100` = 全透（透射率 `1`），`0` = 不透明。**仅平凡变体**。

`> 0` 会自动标为可穿透介质。介质吸收按**介质段一次**（与厚度无关）⇒ 厚块不会越厚越黑。"""
"menu.game.edit.smooth" = "光滑度"
"menu.game.edit.smooth.tip" = """
`100` = 完全镜面（粗糙度 `0`），`0` = 完全粗糙。**仅平凡变体** —— PBR 的粗糙度来自 roughmetal 贴图。"""
"menu.game.edit.pbr" = "PBR 变体"
"menu.game.edit.pbr.tip" = """
笔触落盘时产出哪种材质条目。

- **关**（默认）：平凡材质 —— 颜色 / 自发光 / 透明度 / 光滑度 / 金属度直接写进条目
- **开**：PBR 材质 —— 只记「资产槽号」，**参数全部由资产与它的贴图决定**（albedo + roughmetal 贴图、资产的 emissive / IOR）⇒ 本页其余材质控件**整行置灰、不生效**（含颜色，PBR 不做 tint）

置灰不改值：切回平凡变体时之前调好的参数原样还在。"""
"menu.game.edit.pbr_asset" = "PBR 资产"
"menu.game.edit.metal" = "金属度"
"menu.game.edit.metal.tip" = """
**关** = 电介质、**开** = 完全金属。**仅平凡变体**。

金属度物理上是**二值**的：连续量只是为了给贴图表达过渡（锈蚀 / 磨损 / 掉漆），平凡变体没有贴图可承载它。

**这就是"做镜面"的旋钮** —— 打开时同时给两样东西：

- `F0` = 颜色本身（电介质的 `F0` 只有 `0.04`，正视下反射项仅 `4%`，看不出镜面）
- `kD = 0`：漫反射清零（少了它，那 `96%` 的漫反射会把镜面盖住）

**镜面配方**：颜色 `白色` + 光滑度 `100`（粗糙度 `0`，≥ `96` 才触发反射射线）+ 金属度**开**。
⚠️ 一个方块只有 1 个体素面 ⇒ 只有 1 个反射值，要看到成像得涂**一整片**镜面。"""
"menu.game.world" = "世界"
"menu.game.world.model" = "模型"
"menu.game.world.reload" = "重载世界"
"menu.game.world.dump" = "数据转储"
"menu.game.world.stream_pause" = "暂停流式"
"menu.game.world.stream_pause.tip" = """
**开** ⇒ 流式那一整套不跑：不跟窗、不派发、不挂载、不卸载。

已加载的那一圈**冻结在原地** ⇒ 相机可以直接飞出去看"世界到此为止"的加载边界；关掉即从当前相机位置重新开始加载。
"""
"menu.game.world.load_radius" = "加载半径"
"menu.game.world.load_radius.tip" = """
全分辨率加载半径，切比雪夫距离，单位 chunk（边长 = `256 / vx/m` 米）。

全分辨率树约 `278KB`/chunk ⇒ 半径是**内存的硬杠杆**。
"""
"menu.game.world.unload_radius" = "卸载半径"
"menu.game.world.unload_radius.tip" = """
相机近旁的**保护半径**（切比雪夫，chunk）：这一圈内一律**不参与换出**，须 `>` 加载半径。

用途戳每 `2s` 才回来一批 ⇒ 启动后头两秒没有任何"最近使用"信号，全靠这一圈保住脚下不出现空洞。
"""
"menu.game.world.coarse_radius" = "粗档半径"
"menu.game.world.coarse_radius.tip" = """
粗档（`16³` 体素量化）的加载半径：**xz 平面**上的切比雪夫距离。

粗档树约 `12KB`/chunk，比全分辨率便宜约 `24` 倍 ⇒ 这一圈是视距的杠杆。
"""
"menu.game.world.coarse_height" = "粗档半高"
"menu.game.world.coarse_height.tip" = """
粗档的**竖向**半高（chunk）：粗档环在 `xz` 上是圆柱、在 `y` 上是薄板。

头顶与脚下几十米基本没人看 ⇒ 同样的内存换成 `xz` 半径更值。
"""
"menu.game.world.mount_words" = "挂载预算"
"menu.game.world.mount_words.tip" = """
每帧挂载的字数预算，单位千字/帧（序列化后的字数）。

挂载要主线程装树 + 标脏，后面还排队序列化上传 ⇒ 这是"多快看到新块"的闸门：`256` 千字 ≈ `1MB`/帧 ≈ `0.5ms`/帧。
"""
"menu.game.world.mount_count" = "挂载条数"
"menu.game.world.mount_count.tip" = """
每帧挂载的**条数**上限：防一大堆极小的树把单帧的记账开销顶爆。

字数预算没花完也最多挂这么多条。
"""
"menu.game.world.requests_load" = "请求装载"
"menu.game.world.requests_load.tip" = """
**开** ⇒ 主射线请求的 chunk **不再受半径环约束**（只要在流式窗口内就装）—— 装载位置由射线给、不由距离给。

关掉就退回"请求只在半径环内重排"的纯半径行为。加载区域因此从**对称立方体**变成**顺着视线的那一块**。
"""
"menu.game.world.request_mb" = "常驻池"
"menu.game.world.request_mb.tip" = """
**常驻池的内存预算**（MB）：池满就换出**最久没被主射线看到**的 chunk。

CPU 与 GPU 两侧共用同一个**块数**，而这个块数按 **CPU 侧**的每块约 `0.5MB` 折算（GPU 的 wire 只要约
`0.3MB`）⇒ 这个数基本上就是"进程里那块 chunk 缓存占多少内存"。调 `0` = 不限。
"""
