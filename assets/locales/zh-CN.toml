"menu.render.gi.res.full" = "1/1"
"menu.render.gi.res.half" = "1/2"
"menu.render.gi.res.quarter" = "1/4"
"menu.render.gi.res.tip" = """
GI 网格边长 = 渲染分辨率 ÷ 档位（每一档都跑 GI，不是开关）。

代价按 GI 像素数计：

- `1/2` ≈ 全分辨率的 `1/4`
- `1/4` 再降 4 倍

GI 是低频信号，档位对画质影响很小（几何边界由几何感知上采样兜住）。"""
"menu.render.gi.denoise" = "降噪质量"
"menu.render.gi.denoise.off" = "关"
"menu.render.gi.denoise.low" = "低"
"menu.render.gi.denoise.mid" = "中"
"menu.render.gi.denoise.high" = "高"
"menu.render.gi.denoise.tip" = """
降噪链按成本分档，与 GI 分辨率档正交（对所有分辨率档一视同仁）。

- **关**：一条降噪 pass 都不跑，直接看原始 GI + 几何感知上采样（量原始噪声与上限帧率用）
- **低**（默认）：时域累积 + 5 轮 `3×3`（`8 tap`）atrous
- **中**：atrous 换 `5×5`（`24 tap`）
- **高**：每像素候选数翻倍（GI 射线翻倍，全链最贵的一项）+ 记忆窗 `20→32` 帧

> 本链 = 时域累积（方差驱动权重 + 累积矩 + AABB 钳制）+ 5 轮迭代 atrous，属 **SVGF** 家族（NRD 的 Pre-Blur 角色由时域内的共面邻域 `mean ± K·σ` 离群钳制承担）。"""
"menu.render.gi.sun_bounce" = "太阳反弹"
"menu.render.gi.sun_bounce.tip" = """
GI 射线命中点（**二次顶点**）是否做一次太阳 NEE —— 朝太阳发一条阴影射线，把「被阳光照亮的表面」这一路能量算进间接光。

- **开**：阴影区能被阳光照亮的地面/墙面「弹亮」（GI 的两条能量来源之一，另一条是天光）
- **关**（默认）：二次顶点只剩天光项（`albedo · 天光 · AO / π`），且**整条阴影射线都不发**

性能：实测 `2560×1600` + `1/4` 档下 `gate_gi` `27.1 → 16.1ms`（占该 pass 的 **41%**），全帧 `31.6 → 20.4ms`。
那 11ms 里 **90% 花在 `>32 voxel` 的长程遍历**上（短程只值 1.1ms）——这也是它不能靠「预计算太阳可见性」省掉的原因：太阳在昼夜循环里每帧转动方向，世界空间的可见性缓存不成立（流式大世界更不成立）。

画面：关掉后阴影区/背光面会**变暗变平**；这是**能量层面的取舍**（不是采样层面的噪声取舍），降噪救不回来。静态场景实测差异很小。"""
