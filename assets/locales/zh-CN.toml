# ---------------- DebugMenu（左上角调试菜单）----------------
"menu.video" = "视频"
"menu.video.scale" = "分辨率比"
"menu.video.scale.full" = "1/1"
"menu.video.scale.half" = "1/2"
"menu.video.scale.third" = "1/3"
"menu.video.scale.quarter" = "1/4"
"menu.video.scale.tip" = """
3D 场景按 `1/N` 分辨率渲染，再**整数块复制**放大到窗口（最近邻，不做任何插值）⇒ 大粒像素不糊、边界锐利。

代价分两档：`1/2` 省约 `3/4` 的主射线与降噪，`1/4` 再降 `4` 倍（GI 与主 pass 一起）。

⚠️ 若同时开「抗锯齿」，FXAA 会把块边缘抹一刀（那是它的本职工作）—— 想要纯粹的像素块就别开。"""
"menu.video.fullscreen" = "全屏"
"menu.video.vsync" = "垂直同步"
"menu.video.aa" = "抗锯齿"
"menu.video.aa.tip" = """
**FXAA** 单 pass 边缘抗锯齿：抹平台阶，但治不了运动中的**亚像素闪烁**。"""
"menu.video.fps" = "FPS"
"menu.render" = "渲染"
"menu.render.gi" = "ReSTIR GI"
"menu.render.gi.enabled" = "开启"
"menu.render.gi.res" = "GI分辨率"
"menu.render.gi.res.full" = "1/1"
"menu.render.gi.res.half" = "1/2"
"menu.render.gi.res.quarter" = "1/4"
"menu.render.gi.res.tip" = """
GI 网格边长 = 渲染分辨率 ÷ 档位（每一档都跑 GI，不是开关）。

代价按 GI 像素数计：`1/2` ≈ 全分辨率的 `1/4`，`1/4` 再降 `4` 倍。"""
"menu.render.gi.denoise" = "降噪质量"
"menu.render.gi.denoise.off" = "关"
"menu.render.gi.denoise.low" = "低"
"menu.render.gi.denoise.mid" = "中"
"menu.render.gi.denoise.high" = "高"
"menu.render.gi.denoise.tip" = """
- **关**：不跑降噪链，直接看原始 GI + 几何感知上采样
- **低**（默认）：时域累积 + 5 轮 `3×3` atrous
- **中**：atrous 换 `5×5`
- **高**：候选数翻倍（GI 射线翻倍）+ 记忆窗 `20→32` 帧"""
"menu.render.gi.interval" = "分帧"
"menu.render.gi.interval.1" = "1"
"menu.render.gi.interval.2" = "2"
"menu.render.gi.interval.4" = "4"
"menu.render.gi.interval.8" = "8"
"menu.render.gi.interval.tip" = """
把 GI 采样预算**摊到 N 帧**：每帧只发 `基准候选 ÷ N` 条射线，记忆窗同步 ×N。

**帧时间恒定、稳态噪声不变**（窗内样本数 = 候选数 × 记忆窗，相乘抵消），代价是响应时间 ×N。
`8` 需要「降噪质量 = 高」（每帧 1 条）；低/中档下每帧至少 1 条 ⇒ `8` 等同 `4`。"""
"menu.render.gi.realloc" = "误差驱动"
"menu.render.gi.realloc.off" = "关"
"menu.render.gi.realloc.mild" = "弱"
"menu.render.gi.realloc.mid" = "中"
"menu.render.gi.realloc.strong" = "强"
"menu.render.gi.realloc.tip" = """
按**"已经有多干净"**重分配每帧射线预算（代理量 = 上一帧 reservoir 的样本数 `M`）：
收敛的像素少发（×`0.70 / 0.50 / 0.25`），刚变脏的多发（×`1.40 / 2.00 / 4.00`）。

记忆窗同步放大 ⇒ **窗内样本数不变**：噪声不变、只有响应时间随像素变，因此不会振荡。
默认**关**（阈值与钳位尚未校准）。"""
"menu.render.gi.sun_bounce" = "太阳反弹"
"menu.render.gi.sun_bounce.tip" = """
GI 二次顶点是否朝太阳发一条阴影射线（NEE）。

- **开**：阴影区被阳光「弹亮」
- **关**（默认）：只剩天光项，**整条阴影射线都不发**（2K + `1/4` 档下省 `gate_gi` 的 ~`40%`）

这是**能量取舍**（不是噪声取舍），降噪救不回来。"""
"menu.render.exposure" = "曝光"
"menu.render.exposure.enabled" = "开启"
"menu.render.exposure.ev_up" = "提亮上限"
"menu.render.exposure.ev_up.tip" = "适应暗处的最大增益 = `2^EV`（档）"
"menu.render.exposure.ev_dn" = "压暗上限"
"menu.render.exposure.ev_dn.tip" = "适应亮处的最大衰减 = `2^EV`（档）"
"menu.render.exposure.tau_up" = "变亮时间"
"menu.render.exposure.tau_up.tip" = "往亮处适应的速度（秒）：太小像**闪光**"
"menu.render.exposure.tau_dn" = "变暗时间"
"menu.render.exposure.tau_dn.tip" = "往暗处适应的速度（秒）：太小像**眨眼**"
"menu.render.exposure.key" = "目标中灰"
"menu.render.exposure.key.tip" = "百分位平均亮度被压到的**目标值**"
"menu.render.sun" = "太阳"
"menu.render.sun.vol" = "光柱"
"menu.render.sun.vol.tip" = """
**光柱**（god ray）= 从太阳方向射出来的那些光带。

- 太阳在**画面里**或**画面侧方**时才有；转到背后就没有了（屏幕空间效果的固有边界）；
- 合成是**纯加法**：光柱只是叠上去，背景的亮度与对比不受影响。

关掉 ⇒ 光柱不再绘制（**太阳盘与日晕照常**，它们属于天空背景）。"""
"menu.render.sun.vol_strength" = "强度"
"menu.render.sun.vol_strength.tip" = """
乘在光柱上的强度 —— **"光柱有多亮"的主旋钮**。`0` = 没有光柱。"""
"menu.render.sun.vol_decay" = "衰减"
"menu.render.sun.vol_decay.tip" = """
模糊每一步的权重 —— 它决定光柱**从太阳往外拖多长**：

- 大（`0.95+`）：拖到整屏；
- 中（`0.8~0.9`）：拖到画面中部；
- 小（`0.6`）：短、紧贴太阳（像镜头眩光）。"""
"menu.render.sun.vol_focus" = "集中度"
"menu.render.sun.vol_focus.tip" = """
太阳方向权重的指数 —— 它决定**光柱从多大一片天空射出来**：

- 大（`20+`）：只在太阳附近十几度内（尖锐、像激光束）；
- 小（`1`）：**整个天空**都在发光 ⇒ 更像一层方向性眩光，不像光柱。"""
"menu.render.sun.vol_soft" = "太阳角径"
"menu.render.sun.vol_soft.tip" = """
**天空里那颗太阳盘的半径**（度）。`0` = 太阳只是一个点；它不影响光柱本身。"""
"menu.render.sun.vol_halo" = "日晕"
"menu.render.sun.vol_halo.tip" = """
太阳盘外那圈**解析拖尾**的强度。它不溢出到几何上（那是 bloom 的活）；
调 `0` 就只剩「太阳角径」那个盘。"""
