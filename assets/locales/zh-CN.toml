几乎看不出差别，而 720p 下只花 ≈ `0.35 ms`。想看最细的缝隙光柱再上 `1/2` / `1/1`。"""
"menu.render.sun.vol_quality" = "质量"
"menu.render.sun.vol_quality.low" = "低"
"menu.render.sun.vol_quality.mid" = "中"
"menu.render.sun.vol_quality.high" = "高"
"menu.render.sun.vol_quality.ultra" = "极高"
"menu.render.sun.vol_quality.tip" = """
| 档 | 每帧采样 `S` | 空间段（时域累积恒定开着） |
|---|---|---|
| 低 | 1 | 不跑（只有时域 + 上采样） |
| 中 | 1 | 5 轮 `3×3` atrous |
| 高 | 2 | 5 轮 `5×5` atrous |
| 极高 | 4 | 同高（**射线翻两番**，全链最贵的一项） |

空间段复用 GI 的 atrous 实现（同一份入口，只换绑定）。"""
"menu.render.sun.vol_shadow" = "阴影距离"
"menu.render.sun.vol_shadow.tip" = """
阴影射线的距离上限（voxel）—— **这个效果唯一的成本闸门**（射线越短越便宜）。

**按"遮挡物离雾有多远"选**：室内的光从窗口斜射进来 ⇒ `64~128` 就够；
室外想看**建筑物投在空气中的影**（光柱从建筑后面射出来）⇒ 必须 ≥ 建筑物到雾的距离，取 `256~512`。
超过这个距离的遮挡不再影响该采样点（远处的阴影对这一段雾本来就没多少能量）。"""
"menu.render.sun.vol_density" = "消光 σt"
"menu.render.sun.vol_density.tip" = """
消光系数 `σ_t`（`1/voxel`）：`1/σt` 就是一个 e-folding 的距离（默认 `0.005` ≈ `200` voxel）。

**`0` = 完全没有雾**（整条链一条 dispatch 都不发，自然看不到任何光柱）——这是"关掉"的等价物。
它决定 `k = 1 − e^{−σt·路径}`（散射强度沿路径的饱和速度）：`σt·路径 ≈ 1~2` 时光柱最亮，
太小 ⇒ 光柱淡、太大 ⇒ 没有额外收益（本档不衰减背景，所以调大**不会**把世界压暗）。"""
"menu.render.sun.vol_ground" = "地面雾"
"menu.render.sun.vol_ground.tip" = """
**介质随高度的衰减** `h`（`1/voxel`）：密度沿视线 `exp(−h·dir.y·t)`，**相机高度处 = 1**。

**这是「利落 vs 雾霾」的开关，别设 0。** 均匀介质在室外长视线上会把 `1−e^{−σt·d}` 积到 1
⇒ 一层几乎不随方向变化的薄纱盖满整幅画面（实测就是"雾霾天"）。真实光柱基本只出现在**近地/室内那层**空气，
抬头看天是干净的。

- `0.01`（默认）≈ 每 `69` voxel 密度减半；
- `0.02` ≈ 每 `35` voxel 减半（很贴地，适合室内/林下）；
- `0` = 均匀介质（天空与远景会被薄纱糊掉）。

**往上看会指数变薄、往下看变浓**（地面雾的自然形态）—— 所以它既保住近地的光柱、又让天空保持干净。"""
"menu.render.sun.vol_dist" = "雾距"
"menu.render.sun.vol_dist.tip" = """
积分的**距离上限**（voxel）：超过它之后透射率不再下降、也不再累积散射。

**这是"不变成起雾"的关键一条**：没有它，一条射向天空的射线会一路积到 `e^{-σt·∞} = 0`
⇒ 天空与远景被雾色 100% 替换（整幅画面像起了大雾）。
**默认 `2048`，必须大于"相机到场景深处的距离"**（本工程默认视角 ≈ `700~800` voxel）——
调得比它小，光柱会整条落在雾距之外，看上去就像"没有雾"。"""
"menu.render.sun.vol_gain" = "光柱增益"
"menu.render.sun.vol_gain.tip" = """
乘在太阳散射项上的增益 —— **"光柱有多亮"的主旋钮**（与"雾有多厚"的「消光 σt」正交）。

它补的是能量：本实现只有**单次**散射 + 各向同性环境近似，而真实光柱里多重散射的份额可观
（阳光被反复散射回视线）。

怎么取：
- `8`（默认）：正对太阳时是过曝的眩光，侧向也能看见；
- `12~20`：**暗廊道里那种强劲的侧向光柱**（太阳在画面外、光从窗口斜射进来）——侧向的相位因子
  只有 `0.03~0.05`，要比"正对太阳"亮起来就得靠这个增益；
- `0`：完全没有光柱。"""
"menu.render.sun.vol_aniso" = "前向散射"
"menu.render.sun.vol_aniso.tip" = """
Henyey-Greenstein 各向异性 `g`：正值 = **前向散射**（朝着太阳看最亮 —— 光柱的观感来源）。

- `0` = 各向同性（光柱方向感弱，像整体发亮）；
- `0.55` = 默认（正对太阳 ≈ `7` 倍于侧向，背对几乎看不见）；
- 接近 `1` = 只有正对太阳才看得到（背对时消失，物理上正确）；
- **负值 = 背向散射**（背对太阳最亮）—— 与光柱相反，基本不会想用。"""
"menu.render.sun.vol_ambient" = "环境散射"
"menu.render.sun.vol_ambient.tip" = """
天光（`sky_color`）散射进视线的系数 —— 雾的**亮度地板**。

**默认 `0.02`（近似关掉）**：参考观感是「阳光照到的那段雾亮、其余地方黑」；
调大 ⇒ 阴影里的雾也发亮，整幅画面变成**各向同性的乳白蒙版**（就是"起雾"的样子）。
想要空气透视/雾天氛围时才调它。"""
"menu.render.sun.vol_soft" = "太阳角径"
"menu.render.sun.vol_soft.tip" = """
太阳的**角径**（度）—— 一个量、两处生效（物理上就是同一件事）：
① 阴影射线的锥角（一条射线 = 太阳盘上的一个样本 ⇒ 多帧累积后光柱边缘变软）；
② 天空里那颗**太阳盘**的半径。

`0` = 硬边光柱 + **太阳变成一个点（盘看不见了）**；`0.9`（默认）= 软边光柱 + 一个看得出形状的盘；
更大 ⇒ 边缘更软、太阳更大（上限 `3.4°`），但收敛更慢（当前帧的抖动更明显）。"""
"menu.render.sun.vol_halo" = "日晕"
"menu.render.sun.vol_halo.tip" = """
太阳盘外那圈**解析拖尾**的强度（不占任何 pass，随与太阳的夹角高次幂衰减）。

它不溢出到几何上（那是 glare/bloom，需要另做后处理）。默认 `1.2`：天空里有一圈柔和的光晕。"""
