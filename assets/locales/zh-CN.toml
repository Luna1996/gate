"menu.render.ray.quality.refract" = "折射"
"menu.render.ray.tier" = "镜面质量"
"menu.render.ray.tier.tip" = """
镜面反射（不透明体素与半透明体素）追到什么程度。**镜面恒为逐体素面**（一个面一个反射值）—— 档位只改反射内容的着色质量，高级项不会在低档启用。

- **关**：不发反射射线，只有 `F0·(amb+gi)` 环境近似
- **直射**：反射命中点带上太阳直射与自发光（**0 条额外射线**）。这是"像镜子"的最低要求：命中几何只取天光项时比反射到的天空暗约 `20` 倍，除了天空亮斑什么都看不见
- **天空**（默认）：再让逃逸天空走 `sky_primary`（**0 条额外射线**）⇒ 镜像里看得见太阳盘 / 光晕
- **阴影**：再给反射命中点补太阳 NEE（**每个触发像素 +1 次 DDA**）⇒ 镜像里的明暗正确；上面两档是**无遮挡近似**（背光的墙在镜子里也亮）
- **GI**：反射命中点读取世界空间 GI 累积（WAL）⇒ 镜像里的间接光与彩色反弹与真实场景一致；镜中才可见的面在下一帧补齐

⚠️ **要镜面就得涂一整片**：单个方块只有 1 个面 ⇒ 只有 1 个颜色，看不出成像。"""
"menu.render.ray.tier.off" = "关"
"menu.render.ray.tier.sun" = "直射"
"menu.render.ray.tier.sky" = "天空"
"menu.render.ray.tier.shadow" = "阴影"
"menu.render.ray.tier.gi" = "GI"
"menu.render.ray.nest" = "嵌套层级"
"menu.render.ray.nest.tip" = """
镜子里的镜子最多再反射几级。`0` = 不嵌套（镜子里看不到另一面镜子的倒影），`1 / 2 / 4` = 依次多嵌几级。

**成本只在真的"镜子对着镜子"时才付**：链条遇到**非镜面**的面（墙 / 地形 / 普通方块）立刻断开 ⇒ 日常场景下 `0 / 1 / 2 / 4` 的画面与成本**完全一样**，多出来的只是一次判据。

最坏情况：每个触发像素 `层级 + 1` 条反射射线（上面「镜面质量」选「阴影」或「GI」时每条再 +1 条阴影射线）。

嵌套的镜像仍是**块状镜面**（每级方向都按体素面量化），与整体平色的画风一致。"""
"menu.render.ray.nest.0" = "0"
"menu.render.ray.nest.1" = "1"
"menu.render.ray.nest.2" = "2"
"menu.render.ray.nest.4" = "4"
"menu.render.ray.reach" = "次级射线"
"menu.render.ray.reach.tip" = """
控制**次级射线**（玻璃镜面反射、玻璃透射链里的折线、镜面嵌套链）能追多远，以及发不发。

- **关**：一条次级射线都不发 ⇒ 玻璃只剩透射染色与环境光，没有倒影
- **近**：限 `20m`
- **中**：限 `80m`
- **远**（默认）：无限远，追到世界窗口边界

追太远时多数像素是在空网格里空走：反射方向朝天的像素要一路走到世界边界才判未命中。限长把这段空走砍掉，未命中处直接出环境色。"""
