[workspace]
members = ["gate-app", "gate-voxel", "gate-render", "gate-ui"]
# third_party/wgpu 是独立 workspace（wgpu PR#9361 补丁），必须显式排除：
# 否则 cargo 把它的成员吸收进本 workspace，继承 [workspace.package] 时报错（cargo#12154）
# vendor/parley 同理：本地补丁包（见 [patch.crates-io]）
exclude = ["third_party", "vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# P0.2: Bevy 版本精确锁定（render graph API 随版本破坏性变更频繁）
[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_post_process",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  # 2.7a：FontSource::SystemUi 需要（未启用时 bevy_text 报错且文本不渲染）
  "system_font_discovery",
  "multi_threaded",
  "std",
  "default_font",
  "reflect_auto_register",
  "async_executor",
] }
gate-voxel = { path = "gate-voxel" }
gate-render = { path = "gate-render" }
gate-ui = { path = "gate-ui" }
# 2.7a 主题令牌 RON 反序列化（ron 版本随 bevy 0.19 内部用法，避免双份编译）
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# ADR-0001 对齐表版本；gate-voxel 唯一外部依赖（bevy/wgpu 已传递引入，非新增）
glam = "=0.32.1"
# P2.2 全量构建并行分块（docs/brickmap.md §5）
rayon = "1"
# P3.1 WGSL 编译期校验测试（版本锁 bevy_render 传递的 naga，避免双份编译）
naga = { version = "=29.0.4", features = ["wgsl-in"] }

# Bevy 官方推荐：依赖全优化，本项目代码保持可调试
# 没有它 debug build 慢 10-50 倍（窗口卡死/无响应的根因之一）
# incremental = false：沙箱拦截 target/debug/incremental 写入（os error 5）导致
# rustc 假 ICE（pre-lto-bitcode 写入失败 panic），项目小关闭增量无感
[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

# 注：曾实验将 wgpu patch 到上游修复 PR#9361（third_party/wgpu），因 API breaking
# （SurfaceTexture::present 移至 Queue、NoopBackendOptions/RequestAdapterOptions 加字段）
# bevy_render 0.19.1 无法编译，已撤销。详见 docs/decisions.md ADR-0002。
# third_party/ 目录残留可删，.gitignore 已排除。

# ADR-0005：parley 0.9.0 本地补丁（vendor/parley）——修复 CJK 文本分段
# 现象：gate-ui 中文文本每次排版触发 "ICU4X data error: No segmentation model
# for complex script: Chinese/Japanese"，且整段中文被视为单一不可断行单元。
# 根因：上游用 new_for_non_complex_scripts 构造分段器（无任何复杂文字载荷），
# bevy_text 0.19.1 锁定 parley 0.9，上游无 feature 可开。
# 补丁：word/line 分段器改用 new_dictionary（加载 baked 词典，含 cjdict）。
# 公开 API 未变，bevy_text 无感。不可放入 third_party/（已被 gitignore）。
[patch.crates-io]
parley = { path = "vendor/parley" }

