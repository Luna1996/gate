[workspace]
members = ["gate-app", "gate-voxel", "gate-render", "gate-ui", "gate-physics"]
exclude = ["third_party"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "=0.20.0-rc.1", default-features = false, features = [
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_post_process",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
    "system_font_discovery",
      "complex_script_segmentation",
      "ui_picking",
  "multi_threaded",
  "std",
  "default_font",
  "reflect_auto_register",
  "async_executor",
] }
wgpu-profiler = { version = "0.28", features = ["tracy"] }
tracy-client = "0.18"
gate-voxel = { path = "gate-voxel" }
gate-physics = { path = "gate-physics" }
gate-render = { path = "gate-render" }
gate-ui = { path = "gate-ui" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
glam = "=0.33.2"
rayon = "1"
fastnbt = "2"
fastanvil = { version = "0.32", default-features = false }
flate2 = "1"
png = "0.18"
serde_json = "1"
wesl = { version = "0.5", features = ["naga-ext"] }

[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

