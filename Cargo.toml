[workspace]
members = ["gate-app", "gate-voxel", "gate-render", "gate-ui"]
# third_party / vendor 是独立 workspace（本地补丁包），必须排除，否则其成员被吸收进本 workspace
exclude = ["third_party", "vendor"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Bevy 精确锁定版本（render graph API 破坏性变更频繁）
[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_post_process",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  # FontSource::SystemUi 所需（不启用时 bevy_text 报错且文本不渲染）
  "system_font_discovery",
  "multi_threaded",
  "std",
  "default_font",
  "reflect_auto_register",
  "async_executor",
] }
# bevy "trace" 由 profile feature 按需开启，非剖析构建零 span 开销
# GPU 帧剖析（profile feature）：tracy feature 把 GPU zone 送进 Tracy 时间线
wgpu-profiler = { version = "0.27", features = ["tracy"] }
# CPU 帧剖析（profile feature）：Tracy 客户端，配手写 tracing-subscriber Layer
tracy-client = "0.18"
gate-voxel = { path = "gate-voxel" }
gate-render = { path = "gate-render" }
gate-ui = { path = "gate-ui" }
# 主题令牌 RON 反序列化（版本随 bevy，避免双份编译）
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# 对齐表版本；gate-voxel 唯一外部依赖
glam = "=0.32.1"
# 全量构建并行分块
rayon = "1"
# WESL（wgsl 超集）运行时编译为 WGSL；本项目不使用 bevy 的 shader_format_wesl
# naga-ext：校验器识别 u64/i64/f16 等 Naga 扩展类型
wesl = { version = "0.5", features = ["naga-ext"] }

# 依赖全优化、本项目代码保持可调试；incremental 关闭（沙箱拦截 target/debug/incremental 写入）
[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

# parley 本地补丁（vendor/parley）：补上 CJK 文本分段（上游 0.9 构造分段器时无复杂文字载荷）
[patch.crates-io]
parley = { path = "vendor/parley" }

