[workspace]
members = ["gate-app", "gate-voxel", "gate-render", "gate-ui"]
# third_party 是独立 workspace（本地补丁包），必须排除，否则其成员被吸收进本 workspace
exclude = ["third_party"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

# Bevy 精确锁定版本（render graph API 破坏性变更频繁）
[workspace.dependencies]
bevy = { version = "=0.20.0-rc.1", default-features = false, features = [
  "bevy_winit",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_post_process",
  "bevy_sprite",
  "bevy_sprite_render",
  "bevy_ui",
  "bevy_ui_render",
  "bevy_asset",
  "bevy_log",
  "bevy_state",
  # FontSource::SystemUi 所需（不启用时 bevy_text 报错且文本不渲染）
  "system_font_discovery",
  # CJK 文本分段：bevy_text 透传 parley 的 `complex-scripts`，启用后 icu_segmenter
  # 载入字典（CJK 断行/断词正确）。缺它则中文整体退化成一个不可断的词
  "complex_script_segmentation",
  # UI 指针交互：`Hovered` / `PointerPress|Release|Click` / `Pickable`（0.20 起 `Interaction`
  # 已 crate 私有化，hover/press 必须走 picking）
  "ui_picking",
  "multi_threaded",
  "std",
  "default_font",
  "reflect_auto_register",
  "async_executor",
] }
# bevy "trace" 由 profile feature 按需开启，非剖析构建零 span 开销
# GPU 帧剖析（profile feature）：tracy feature 把 GPU zone 送进 Tracy 时间线
# 版本必须与 bevy 的 wgpu 主版本对齐（0.28 ↔ wgpu 30，即 bevy 0.20）
wgpu-profiler = { version = "0.28", features = ["tracy"] }
# CPU 帧剖析（profile feature）：Tracy 客户端，配手写 tracing-subscriber Layer
tracy-client = "0.18"
gate-voxel = { path = "gate-voxel" }
gate-render = { path = "gate-render" }
gate-ui = { path = "gate-ui" }
# 主题令牌 RON 反序列化（版本随 bevy，避免双份编译）
serde = { version = "1", features = ["derive"] }
ron = "0.12"
# 对齐表版本（随 bevy 0.20 的 bevy_math，避免双份 glam 编译）
glam = "=0.33.2"
# 全量构建并行分块
rayon = "1"
# MC 地图流式加载（gate-app/src/mc）：**存档读取全用现成 crate**，不自己实现 NBT / Anvil。
# - fastnbt：MC 的 NBT 反序列化（serde），`pre18` 区块结构与它同源
# - fastanvil：region（.mca）索引与解压（zlib / gzip / lz4 / 裸）＋ 1.13–1.17 区块结构
#   （`pre18::{Level, Pre18Section}` 与位打包展开）—— 默认特性 `render` 拉 `image`/调色板渲染，
#   与本项目无关，关掉
# 贴图 PNG / blockstate+model JSON 走已在依赖树里的 png / serde_json（后者无同类替代：MC 的资源包
# 模型格式没有成熟 Rust 解析 crate，见 `docs/mc_map.md` §4）。
fastnbt = "2"
fastanvil = { version = "0.32", default-features = false }
flate2 = "1"
png = "0.18"
serde_json = "1"
# WESL（wgsl 超集）运行时编译为 WGSL；本项目不使用 bevy 的 shader_format_wesl
# naga-ext：校验器识别 u64/i64/f16 等 Naga 扩展类型
wesl = { version = "0.5", features = ["naga-ext"] }

# 依赖全优化、本项目代码保持可调试；incremental 关闭（沙箱拦截 target/debug/incremental 写入）
[profile.dev]
opt-level = 1
incremental = false

[profile.dev.package."*"]
opt-level = 3

