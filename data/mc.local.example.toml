# 每台开发机不同；复制为 data/mc.local.toml 后填写。
# data/ 已 gitignore，本地文件不会进仓库。
# 只需提供 MC 版本目录；程序自动读取：
#   saves/Greenfield*   地图
#   resourcepacks/*     资源包（按 options.txt 的 resourcePacks 顺序）
#   <版本名>.jar        原版资源
# 也可用环境变量 GATE_MC_VERSION / GATE_GREEN_FIELD / GATE_MC_ASSETS / GATE_MC_VANILLA 覆盖。

mc = 'C:\Users\you\AppData\Roaming\.minecraft\versions\Greenfield'

# 可选：覆盖自动发现的地图目录
# map = 'C:\path\to\saves\Greenfield v0.5.4'

# 可选：覆盖资源包顺序（MC 顺序，后面的覆盖前面的；不含原版 jar）
# packs = [
#   'C:\path\to\resourcepacks\SPBR.zip',
#   'C:\path\to\resourcepacks\Greenfield.zip',
# ]
