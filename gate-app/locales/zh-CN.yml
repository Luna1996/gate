# gate-app 中文文案表（rust-i18n 编译期 codegen 进二进制）
#
# 格式：_version 1 = 每语言一个文件（locales/<locale>.yml），加语言 = 加文件 + 在
# DebugView 露出切换项（调 rust_i18n::set_locale）。
#
# 约定：
# - 键 = 「模块.控件」语义路径，调用点写 t!("模块.控件")
# - 占位符 %{name}；**定长对齐的数字由调用点先 format! 好再传入**（%{x} 是原样替换，
#   不会丢 "{:>7.1}" 这类宽度），所以数字列宽不随语言变化
# - 只收**可见 UI 文案**。以下保持英文、不进本表：
#   日志、技术标识符（DDGI / LOD / wsum / Domain / Probe）、单位（v/s、vx）、
#   材质预设名（EDIT_MATERIALS.name，属于数据层，见 docs 后续）
_version: 1

