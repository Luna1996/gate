[package]
name = "gate-ui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bevy = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
# FontAwesome 图标码点常量（chars::* / strs::*）；字体文件 assets/fonts/fa-solid-900.ttf（5.15.4）
font-awesome = "0.2"
# 菜单层级/控件状态的持久化格式（版本与 bevy 传递依赖一致，避免双份编译）
toml = "0.8"
# Markdown 解析（CommonMark/GFM AST，零拷贝借源串）。default features 会拖入 clap + syntect-onig（C 依赖），必须关掉
comrak = { version = "0.55", default-features = false }
