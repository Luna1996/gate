[package]
name = "gate-ui"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bevy = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
# FontAwesome 图标码点常量（chars::* / strs::*），字体文件见 assets/fonts/fa-solid-900.ttf
# （FA 5.15.4 Free Solid，码点与 crate 常量逐一对齐）
font-awesome = "0.2"
# 菜单层级/控件状态的持久化格式（与 bevy 传递依赖同版本，避免双份编译）
toml = "0.8"
