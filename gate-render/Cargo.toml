[package]
name = "gate-render"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
profile = ["dep:wgpu-profiler"]
dlss = ["dep:dlss_wgpu", "dep:ash", "bevy/raw_vulkan_init"]

[dependencies]
bevy = { workspace = true, features = ["jpeg"] }
dlss_wgpu = { version = "=6.0.1", optional = true }
ash = { version = "0.38", optional = true, default-features = false }
glam = { workspace = true }
gate-voxel = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
uuid = "1"
wgpu = "=30.0.1"
wgpu-profiler = { workspace = true, optional = true }
wesl = { workspace = true }

[build-dependencies]
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
wesl = { workspace = true }
